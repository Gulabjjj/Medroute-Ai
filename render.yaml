services:
  # 1) FastAPI AI service
  - type: web
    name: medroute-ai-service
    runtime: python
    rootDir: ai-service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false # set to the client URL after the client is deployed

  # 2) Express API server
  - type: web
    name: medroute-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        sync: false # e.g. https://medroute-ai-service.onrender.com
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
      - key: OTP_EXPIRY_MINUTES
        value: "10"

  # 3) React (Vite) client
  - type: web
    name: medroute-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_URL
        sync: false # e.g. https://medroute-server.onrender.com/api
      - key: VITE_AI_URL
        sync: false # e.g. https://medroute-ai-service.onrender.com
    routes:
      # SPA fallback so refreshing /login, /dashboard etc. doesn't 404
      - type: rewrite
        source: /*
        destination: /index.html
